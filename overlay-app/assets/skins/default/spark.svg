<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- One crack spark. Drawn many times per crack, so keep it cheap. -->
  <defs>
    <radialGradient id="hot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fffdf5" stop-opacity="1"/>
      <stop offset="32%"  stop-color="#ffe9b0" stop-opacity=".9"/>
      <stop offset="66%"  stop-color="#f5b942" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="12" cy="12" r="12" fill="url(#hot)"/>
  <g stroke="#fff8e1" stroke-width="1.1" stroke-linecap="round" opacity=".8">
    <path d="M12 4.5 v-3"/><path d="M12 19.5 v3"/>
    <path d="M4.5 12 h-3"/><path d="M19.5 12 h3"/>
  </g>
</svg>
