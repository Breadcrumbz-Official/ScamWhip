<svg xmlns="http://www.w3.org/2000/svg" width="76" height="26" viewBox="0 0 76 26">
  <!-- Grip. Anchor in skin.json is [0.82, 0.5]: the lash leaves from the
       right-hand end, so most of the art sits behind the first rope point. -->
  <defs>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8a6440"/>
      <stop offset="35%"  stop-color="#5c3f28"/>
      <stop offset="100%" stop-color="#2a1a10"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0d49a"/>
      <stop offset="50%"  stop-color="#c9a463"/>
      <stop offset="100%" stop-color="#6d5227"/>
    </linearGradient>
  </defs>

  <!-- butt knob -->
  <ellipse cx="7" cy="13" rx="7" ry="11" fill="url(#grip)"/>
  <ellipse cx="6" cy="11" rx="3.4" ry="5" fill="#a37a4e" opacity=".5"/>

  <!-- body -->
  <rect x="6" y="3" width="58" height="20" rx="9" fill="url(#grip)"/>

  <!-- wrap rings -->
  <g fill="none" stroke="#20130b" stroke-width="1.6" opacity=".75">
    <path d="M17 3.6 q3 9.4 0 18.8"/>
    <path d="M25 3.2 q3 9.8 0 19.6"/>
    <path d="M33 3.2 q3 9.8 0 19.6"/>
    <path d="M41 3.6 q3 9.4 0 18.8"/>
  </g>
  <g fill="none" stroke="#9c7449" stroke-width=".9" opacity=".55">
    <path d="M18.4 3.6 q3 9.4 0 18.8"/>
    <path d="M26.4 3.2 q3 9.8 0 19.6"/>
    <path d="M34.4 3.2 q3 9.8 0 19.6"/>
    <path d="M42.4 3.6 q3 9.4 0 18.8"/>
  </g>

  <!-- highlight along the top -->
  <path d="M12 6.5 q22 -2.4 46 0" stroke="#c79a63" stroke-width="2" fill="none" opacity=".4" stroke-linecap="round"/>

  <!-- collar into the lash -->
  <rect x="58" y="5" width="8" height="16" rx="3.4" fill="url(#collar)"/>
  <rect x="66" y="7.5" width="8" height="11" rx="4" fill="#4a3120"/>
</svg>
