<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Whip — Mail Inspection</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- The ink-displacement filter that gives the stamp its worn edge. -->
  <svg class="defs" aria-hidden="true">
    <filter id="inkTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="7"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
  </svg>

  <div class="popup">
    <div class="popup-head">
      <div>
        <div class="wordmark">
          <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 6l8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span id="brandName"></span>
        </div>
        <div class="tagline" id="brandTagline"></div>
      </div>
      <button class="kebab" id="btnSettings" title="Settings" aria-label="Settings">&#8942;</button>
    </div>

    <div class="status-strip">
      <span class="status" id="statusOverlay"><i></i><span>overlay</span></span>
      <span class="status" id="statusBackend"><i></i><span>backend</span></span>
    </div>

    <div class="scan-target">
      <span class="from" id="popFrom"></span>
      <span class="subj" id="popSubj"></span>
    </div>

    <div class="verdict-zone">
      <div class="loading-wrap hide" id="loadingWrap">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">INSPECTING MESSAGE…</div>
      </div>
      <div class="stamp-wrap show" id="stampWrap">
        <div class="stamp" id="stampEl"></div>
        <div class="confidence" id="confEl"></div>
      </div>
    </div>

    <div class="flags">
      <div class="flags-head" id="flagsHead"></div>
      <div id="flagsList"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btnPrimary"></button>
      <button class="btn btn-secondary" id="btnSecondary"></button>
    </div>
    <div class="report-link"><a id="reportLink" role="button" tabindex="0"></a></div>

    <div class="toast" id="toast"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
